<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FitGestor — Gestão de Academias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0b0d12;--bg2:#12151d;--card:#171b25;--line:#252b38;--txt:#e9ecf3;--mut:#8b93a7;--acc:#c6f432;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5}
a{color:inherit}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--txt);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px;font-weight:500}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--line);color:var(--txt);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.15)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.p{background:var(--acc);color:#111}
.btn.g{background:#25d366;color:#05351a}
.btn.d{background:#3a1d22;color:var(--bad)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.shell{display:flex;min-height:100vh}
.side{width:240px;background:var(--bg2);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{font-weight:800;font-size:20px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px;padding:0 6px 16px}
.logo b{color:var(--acc)}
.logo .ic{width:32px;height:32px;border-radius:9px;background:var(--acc);display:grid;place-items:center;font-size:17px}
.acad-name{font-size:12px;color:var(--mut);padding:0 6px 14px;border-bottom:1px solid var(--line);margin-bottom:12px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--mut);font-weight:500;cursor:pointer;margin-bottom:2px}
.nav a:hover{background:var(--card);color:var(--txt)}
.nav a.on{background:var(--card);color:var(--acc)}
.side .foot{margin-top:auto;font-size:12px;color:var(--mut);padding:10px 6px;border-top:1px solid var(--line);word-break:break-all}
.main{flex:1;padding:28px;max-width:1200px;width:100%;min-width:0}
h1{font-size:24px;font-weight:800;letter-spacing:-.5px}
h2{font-size:16px;font-weight:700;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.sub{color:var(--mut);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-top:4px}
.kpi .l{color:var(--mut);font-size:12.5px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);font-weight:600;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:#ffffff06}
.tbl{overflow-x:auto}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-pago{background:#10392b;color:var(--ok)}.b-pendente{background:#3b3214;color:var(--warn)}.b-atrasado,.b-bloq{background:#3d1b1f;color:var(--bad)}.b-inativo{background:#252b38;color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.fg .full{grid-column:1/-1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs a{padding:10px 14px;color:var(--mut);cursor:pointer;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--acc);border-color:var(--acc)}
.overlay{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:50;padding:16px;overflow-y:auto}
.modal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;width:100%;max-width:620px;max-height:92vh;overflow-y:auto}
.modal.wide{max-width:780px}
.modal h2{font-size:18px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--acc);color:#111;padding:11px 18px;border-radius:10px;font-weight:600;z-index:99;box-shadow:0 8px 30px #0008;max-width:90vw;text-align:center}
.toast.err{background:var(--bad);color:#fff}
.empty{color:var(--mut);text-align:center;padding:30px}
.av{width:36px;height:36px;border-radius:50%;background:#2a3142;display:grid;place-items:center;font-weight:700;color:var(--acc);flex-shrink:0;font-size:13px}
.ex{display:grid;grid-template-columns:2.4fr .7fr .7fr .8fr .8fr 34px;gap:6px;margin-bottom:6px}
.prog{height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,#1c2410 0,var(--bg) 60%)}
.lbox{width:100%;max-width:420px}
.demo{background:#1a2110;border:1px solid #3b4d14;border-radius:12px;padding:14px;margin-top:16px;font-size:13px}
.chartbox{height:250px;position:relative}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.pix{font-family:ui-monospace,monospace;background:var(--bg2);border:1px dashed var(--acc);padding:10px;border-radius:10px;word-break:break-all;font-size:13px}
.ap{max-width:560px;margin:0 auto;padding:18px 16px 96px}
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20}
.bnav a{flex:1;max-width:190px;text-align:center;padding:9px 0 12px;color:var(--mut);font-size:12px;font-weight:600;cursor:pointer}
.bnav a span{display:block;font-size:20px}
.bnav a.on{color:var(--acc)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.chip{padding:8px 15px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;cursor:pointer;white-space:nowrap;font-size:13px}
.chip.on{background:var(--acc);color:#111;border-color:var(--acc)}
.exc{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer;user-select:none}
.exc.ok{opacity:.55}.exc.ok .nm{text-decoration:line-through}
.ck{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex-shrink:0;font-weight:800;font-size:13px}
.exc.ok .ck{background:var(--acc);border-color:var(--acc);color:#111}
.dbar{background:var(--warn);color:#111;text-align:center;font-size:12.5px;padding:6px 10px;font-weight:600}
.aviso{border-color:var(--warn);margin-bottom:16px}
@media(max-width:820px){
 .shell{flex-direction:column}
 .side{width:100%;height:auto;position:static;padding:12px;border-right:0;border-bottom:1px solid var(--line)}
 .nav{display:flex;overflow-x:auto;gap:4px}.nav a{white-space:nowrap}
 .side .foot,.acad-name{display:none}.logo{padding-bottom:10px}
 .main{padding:16px}.grid2{grid-template-columns:1fr}
 .ex{grid-template-columns:1fr 1fr 1fr;padding-bottom:8px;border-bottom:1px dashed var(--line)}.ex .n{grid-column:1/-1}.exhead{display:none}
 h1{font-size:21px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =====================================================================
   FitGestor — sistema para várias academias
   CONFIGURAÇÃO: cole aqui a configuração do seu projeto Firebase.
   Enquanto ficar null, o sistema roda em MODO DEMONSTRAÇÃO (dados só no navegador).
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA9WOrmD6h0MDL0G4gDsdQg-A2yG4E5L1o",
  authDomain: "academias-d33fd.firebaseapp.com",
  projectId: "academias-d33fd",
  storageBucket: "academias-d33fd.firebasestorage.app",
  messagingSenderId: "447392492522",
  appId: "1:447392492522:web:218b201628228f547c2093"
};
/* Exemplo:
const FIREBASE_CONFIG = {
  apiKey: "AIza...",
  authDomain: "fitgestor-xxxx.firebaseapp.com",
  projectId: "fitgestor-xxxx",
  storageBucket: "fitgestor-xxxx.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abc123"
};
*/
const TOLERANCIA_DIAS = 5; // dias de atraso da academia antes de bloquear o acesso

const MODE = FIREBASE_CONFIG ? 'firebase' : 'demo';
let fdb = null, fauth = null, mem = null;
const S = { perfil:null, acad:null, sis:{}, charts:[], refresh:()=>{} };

/* ======================= utilitários ======================= */
const $ = s => document.querySelector(s);
const app = () => document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R = v => (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num = v => (v===''||v==null) ? NaN : Number(String(v).replace(',','.'));
const fmtN = n => Number(n).toLocaleString('pt-BR',{maximumFractionDigits:1});
const pad = n => String(n).padStart(2,'0');
const isoDe = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoje = () => isoDe(new Date());
const fmtD = s => s ? s.split('-').reverse().join('/') : '—';
const addDias = (iso,n) => { const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return isoDe(d); };
const addMeses = (iso,n) => { const [y,m,d]=iso.split('-').map(Number); const ult=new Date(y,m-1+n+1,0).getDate(); return isoDe(new Date(y,m-1+n,Math.min(d,ult),12)); };
const diasEntre = (a,b) => Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const mesAtual = () => hoje().slice(0,7);
const mesAnterior = c => { const [y,m]=c.split('-').map(Number); const d=new Date(y,m-2,1); return d.getFullYear()+'-'+pad(d.getMonth()+1); };
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const nomeMes = c => c ? MESES[Number(c.slice(5,7))-1]+'/'+c.slice(0,4) : '';
const clampDia = d => Math.min(28, Math.max(1, parseInt(d)||10));
const vencDe = (comp,dia) => comp+'-'+pad(clampDia(dia));
const soDig = s => String(s||'').replace(/\D/g,'');
const wa = (tel,txt) => { let n=soDig(tel); if(n && !n.startsWith('55')) n='55'+n; return `https://wa.me/${n}?text=${encodeURIComponent(txt)}`; };
const primeiroNome = n => String(n||'').trim().split(/\s+/)[0] || '';
const ini = n => { const p=String(n||'?').trim().split(/\s+/); return esc(((p[0]||'')[0]||'')+(p.length>1?p[p.length-1][0]:'')).toUpperCase(); };
const idade = n => { const d=new Date(n+'T12:00:00'), h=new Date(); let i=h.getFullYear()-d.getFullYear(); if(h.getMonth()<d.getMonth()||(h.getMonth()===d.getMonth()&&h.getDate()<d.getDate())) i--; return i; };
const idx = l => Object.fromEntries(l.map(x=>[x.id,x]));
const soma = (l,k='valor') => l.reduce((s,x)=>s+(Number(x[k])||0),0);
const porNome = (a,b) => (a.nome||'').localeCompare(b.nome||'','pt-BR');
const porData = (a,b) => (a.data||'').localeCompare(b.data||'');
const clone = x => x==null ? x : JSON.parse(JSON.stringify(x));
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const urlPainel = () => location.href.split('#')[0].split('?')[0];
const dataExtenso = () => new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
const gerarSenha = () => Array.from({length:8},()=>'abcdefghjkmnpqrstuvwxyz23456789'[Math.floor(Math.random()*31)]).join('');
const opts = (list,sel) => (sel&&!list.includes(sel)?[...list,sel]:list).map(o=>`<option ${o===sel?'selected':''}>${esc(o)}</option>`).join('');
const lerForm = f => Object.fromEntries(new FormData(f));
const ss = { get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}}, del:k=>{try{sessionStorage.removeItem(k)}catch(e){}} };
const P = sub => `academias/${S.acad.id}/${sub}`;
const kpi = (l,v,ic,cor) => `<div class="card kpi"><div class="l">${ic||''} ${l}</div><div class="v" style="${cor?'color:'+cor:''}">${v}</div></div>`;
const demoBar = () => MODE==='demo' ? `<div class="dbar">Modo demonstração — os dados ficam só neste navegador. Configure o Firebase para usar de verdade.</div>` : '';

function toast(msg, err){ document.querySelectorAll('.toast').forEach(t=>t.remove()); const t=document.createElement('div'); t.className='toast'+(err?' err':''); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), err?4500:2600); }
function abrirModal(html, wide){ fecharModal(); const o=document.createElement('div'); o.className='overlay'; o.innerHTML=`<div class="modal ${wide?'wide':''}">${html}</div>`; o.addEventListener('mousedown',e=>{ if(e.target===o) fecharModal(); }); document.body.appendChild(o); const f=o.querySelector('input:not([type=hidden])'); if(f) setTimeout(()=>f.focus(),50); return o.querySelector('.modal'); }
function fecharModal(){ document.querySelectorAll('.overlay').forEach(o=>o.remove()); }
const rodapeModal = txt => `<div class="mfoot"><button type="button" class="btn ghost" onclick="fecharModal()">Cancelar</button><button class="btn p">${txt}</button></div>`;
function onSubmit(el, fn){ const f=el.querySelector('form'); f.onsubmit=async e=>{ e.preventDefault(); const b=f.querySelector('button.p'); if(b){ b.disabled=true; b.dataset.t=b.textContent; b.textContent='Salvando...'; } try{ await fn(lerForm(f), f); }catch(err){ console.error(err); toast(erroAuth(err),1); if(b&&b.isConnected){ b.disabled=false; b.textContent=b.dataset.t; } } }; }
function copiar(v){ const ok=()=>toast('Copiado!'); if(navigator.clipboard&&window.isSecureContext){ navigator.clipboard.writeText(v).then(ok).catch(()=>fb()); } else fb(); function fb(){ const t=document.createElement('textarea'); t.value=v; document.body.appendChild(t); t.select(); try{document.execCommand('copy'); ok();}catch(e){toast('Não foi possível copiar',1)} t.remove(); } }
function erroAuth(e){ const c=(e&&e.code)||''; if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return 'E-mail ou senha incorretos.'; if(c.includes('email-already-in-use')) return 'Este e-mail já tem cadastro.'; if(c.includes('weak-password')) return 'Senha fraca: use pelo menos 6 caracteres.'; if(c.includes('invalid-email')) return 'E-mail inválido.'; if(c.includes('too-many-requests')) return 'Muitas tentativas. Aguarde alguns minutos.'; if(c.includes('permission-denied')) return 'Sem permissão para esta ação.'; return (e&&e.message)||'Erro inesperado.'; }

/* ======================= dados (Firebase ou demonstração) ======================= */
const Store = {
  async list(path, where){
    if(MODE==='firebase'){ let q=fdb.collection(path); if(where) q=q.where(where[0],'==',where[1]); const s=await q.get(); return s.docs.map(d=>({id:d.id,...d.data()})); }
    return Object.entries(mem.db[path]||{}).map(([id,d])=>({id,...clone(d)})).filter(d=>!where||d[where[0]]===where[1]);
  },
  async get(path,id){
    if(MODE==='firebase'){ const d=await fdb.collection(path).doc(id).get(); return d.exists?{id:d.id,...d.data()}:null; }
    const d=(mem.db[path]||{})[id]; return d?{id,...clone(d)}:null;
  },
  async add(path,data){
    if(MODE==='firebase'){ const r=await fdb.collection(path).add(data); return r.id; }
    const id=uid(); (mem.db[path]=mem.db[path]||{})[id]=clone(data); salvarDemo(); return id;
  },
  async set(path,id,data,merge=true){
    if(MODE==='firebase'){ await fdb.collection(path).doc(id).set(data,{merge}); return; }
    const c=(mem.db[path]=mem.db[path]||{}); c[id]=merge?{...(c[id]||{}),...clone(data)}:clone(data); salvarDemo();
  },
  async del(path,id){
    if(MODE==='firebase'){ await fdb.collection(path).doc(id).delete(); return; }
    if(mem.db[path]) delete mem.db[path][id]; salvarDemo();
  }
};
const Auth = {
  async login(email,senha){
    email=String(email).trim().toLowerCase();
    if(MODE==='firebase'){ const c=await fauth.signInWithEmailAndPassword(email,senha); return c.user.uid; }
    const u=Object.entries(mem.users).find(([,u])=>u.email===email&&u.senha===senha);
    if(!u) throw {code:'invalid-credential'}; ss.set('fg_uid',u[0]); return u[0];
  },
  async logout(){ S.perfil=null; S.acad=null; if(MODE==='firebase') await fauth.signOut(); else ss.del('fg_uid'); },
  async criarUsuario(email,senha){
    email=String(email).trim().toLowerCase();
    if(MODE==='firebase'){ const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(FIREBASE_CONFIG,'sec'); const c=await sec.auth().createUserWithEmailAndPassword(email,senha); await sec.auth().signOut(); return c.user.uid; }
    if(String(senha).length<6) throw {code:'weak-password'};
    if(Object.values(mem.users).some(u=>u.email===email)) throw {code:'email-already-in-use'};
    const id=uid(); mem.users[id]={email,senha}; salvarDemo(); return id;
  },
  async resetSenha(email){
    if(MODE==='firebase'){ await fauth.sendPasswordResetEmail(String(email).trim()); return 'Enviamos um link para redefinir a senha no e-mail informado.'; }
    const u=Object.values(mem.users).find(u=>u.email===String(email).trim().toLowerCase()); if(u){ u.senha='123456'; salvarDemo(); }
    return 'Demonstração: a senha foi redefinida para 123456.';
  },
  apagarDemo(id){ if(MODE==='demo'){ delete mem.users[id]; salvarDemo(); } }
};

const LS='fitgestor_demo_v1';
function salvarDemo(){ try{ localStorage.setItem(LS, JSON.stringify(mem)); }catch(e){} }
function carregarDemo(){ try{ mem=JSON.parse(localStorage.getItem(LS)); }catch(e){} if(!mem||!mem.db){ mem=seed(); salvarDemo(); } }
function resetDemo(){ if(!confirm('Apagar tudo e restaurar os dados de exemplo?')) return; mem=seed(); salvarDemo(); ss.del('fg_uid'); telaLogin(); toast('Dados de exemplo restaurados.'); }

function seed(){
  const h=hoje(), m=mesAtual(), mp=mesAnterior(m), db={};
  const put=(p,id,d)=>{ (db[p]=db[p]||{})[id]=d; };
  put('config','sistema',{nome:'FitGestor',pix:'sua-chave-pix@email.com',whatsapp:'',valorPadrao:99.9});
  put('academias','acad1',{nome:'Academia Força Total',responsavel:'Carlos Lima',whatsapp:'(88) 99999-1111',email:'admin@demo.com',pix:'forcatotal@pix.com',endereco:'Rua Principal, 100 — Centro',valorPlano:99.9,vencimento:addDias(h,18),status:'ativo',criadoEm:addDias(h,-90),pagamentos:[{data:addDias(h,-12),valor:99.9,meses:1}],donoUid:'u_admin'});
  put('academias','acad2',{nome:'Studio Corpo em Forma',responsavel:'Ana Souza',whatsapp:'(88) 99999-2222',email:'admin2@demo.com',pix:'',endereco:'',valorPlano:79.9,vencimento:addDias(h,-12),status:'ativo',criadoEm:addDias(h,-60),pagamentos:[],donoUid:'u_admin2'});
  const users={u_super:{email:'super@demo.com',senha:'123456'},u_admin:{email:'admin@demo.com',senha:'123456'},u_admin2:{email:'admin2@demo.com',senha:'123456'},u_aluno:{email:'aluno@demo.com',senha:'123456'}};
  put('usuarios','u_super',{papel:'superadmin',nome:'Dono do sistema',email:'super@demo.com'});
  put('usuarios','u_admin',{papel:'admin',academiaId:'acad1',nome:'Carlos Lima',email:'admin@demo.com'});
  put('usuarios','u_admin2',{papel:'admin',academiaId:'acad2',nome:'Ana Souza',email:'admin2@demo.com'});

function statusMens(m){ if(m.pagoEm) return ['pago','Pago']; if(m.vencimento<hoje()) return ['atrasado','Atrasado']; return ['pendente','Pendente']; }
function acadBloqueada(a){ return a.status==='bloqueado' || diasEntre(a.vencimento,hoje())>TOLERANCIA_DIAS; }
function situacaoAcad(a){
  if(a.status==='bloqueado') return ['bloq','Bloqueada'];
  const d=diasEntre(hoje(),a.vencimento);
  if(d<0) return -d>TOLERANCIA_DIAS?['bloq',`Suspensa (${-d}d)`]:['atrasado',`Atrasada ${-d}d`];
  if(d<=5) return ['pendente',d===0?'Vence hoje':`Vence em ${d}d`];
  return ['pago','Em dia'];
}

/* ---------- medidas e metas ---------- */
const imc=m=>{ const p=num(m.peso); let h=num(m.altura); if(!p||!h) return ''; if(h>3) h=h/100; return fmtN(p/(h*h)); };
function blocoMetas(md,metas){
  metas=metas||{}; const itens=METAS.filter(([k])=>metas[k]!==undefined&&metas[k]!=='');
  if(!itens.length) return '<p class="sub">Nenhuma meta definida ainda.</p>';
  return itens.map(([k,t,u])=>{
    const vals=md.filter(x=>!isNaN(num(x[k]))), meta=num(metas[k]); let p=0, txt=`Meta: ${fmtN(meta)} ${u}`;
    if(vals.length){ const i=num(vals[0][k]), a=num(vals[vals.length-1][k]); p=i===meta?100:Math.max(0,Math.min(100,(i-a)/(i-meta)*100)); txt=`${fmtN(i)} → <b>${fmtN(a)}</b> → meta ${fmtN(meta)} ${u}`; }
    return `<div style="margin-bottom:12px"><div class="row" style="justify-content:space-between;margin-bottom:5px;gap:4px"><b>${t}</b><span class="sub">${txt} · ${Math.round(p)}%</span></div><div class="prog"><i style="width:${p}%"></i></div></div>`;
  }).join('');
}
function tabelaMedidas(md,del){
  if(!md.length) return '<div class="empty">Nenhuma avaliação registrada.</div>';
  const cols=CAMPOS.filter(([k])=>k!=='altura'&&md.some(x=>!isNaN(num(x[k]))));
  return `<table><thead><tr><th>Data</th>${cols.map(c=>`<th>${c[1]}</th>`).join('')}<th>IMC</th>${del?'<th></th>':''}</tr></thead><tbody>${[...md].reverse().map(x=>`<tr><td>${fmtD(x.data)}</td>${cols.map(([k])=>`<td>${isNaN(num(x[k]))?'—':fmtN(x[k])}</td>`).join('')}<td>${imc(x)||'—'}</td>${del?`<td style="text-align:right"><button class="btn sm ghost" onclick="excluirMedida('${x.id}')">🗑</button></td>`:''}</tr>`).join('')}</tbody></table>`;
}
const selCampo=()=>`<select id="selCampo" style="width:auto;padding:6px 10px" onchange="desenharEvol()">${CAMPOS.filter(c=>c[0]!=='altura').map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}</select>`;
function desenharEvol(){
  limparCharts(); const s=$('#selCampo'); if(!s) return; const k=s.value;
  const md=S.medidas.filter(x=>!isNaN(num(x[k])));
  const box=$('#cEvol').parentElement; const vazio=box.querySelector('.empty'); if(vazio) vazio.remove();
  if(!md.length){ box.insertAdjacentHTML('beforeend','<div class="empty" style="position:absolute;inset:0;display:grid;place-items:center">Sem dados para esta medida.</div>'); return; }
  const ds=[{label:rotulo(k),data:md.map(x=>num(x[k]))}];
  if(S.metas&&!isNaN(num(S.metas[k]))) ds.push({label:'Meta',data:md.map(()=>num(S.metas[k])),borderDash:[6,6],pointRadius:0,fill:false});
  grafico('cEvol',md.map(x=>fmtD(x.data).slice(0,5)),ds);
}

  const md=(await Store.list(P('medidas'),['alunoId',a.id])).sort(porData); S.medidas=md; S.metas=a.metas||{};
  el.innerHTML=`<div class="row" style="justify-content:flex-end;margin-bottom:14px"><button class="btn ghost sm" onclick="editarMetas()">🎯 Definir metas</button><button class="btn p sm" onclick="novaMedida()">+ Nova avaliação</button></div>
  <div class="grid2"><div class="card"><h2>🎯 Metas do aluno</h2>${blocoMetas(md,S.metas)}<p class="sub" style="margin-top:6px">Metas são opcionais — defina só as que fizerem sentido para o aluno.</p></div>
  <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">📈 Evolução</h2>${selCampo()}</div><div class="chartbox"><canvas id="cEvol"></canvas></div></div></div>
  <div class="card tbl" style="margin-top:14px;padding:6px 10px">${tabelaMedidas(md,true)}</div>`;
  desenharEvol();
};
function novaMedida(){
  const ult=S.medidas[S.medidas.length-1]||{};
  const m=abrirModal(`<h2>Nova avaliação — ${esc(S.aluno.nome)}</h2><form><div class="fg"><div><label>Data</label><input type="date" name="data" value="${hoje()}" required></div>
  ${CAMPOS.map(([k,t,u])=>`<div><label>${t} (${u})</label><input type="number" step="any" min="0" name="${k}" value="${k==='altura'&&ult.altura?ult.altura:''}" placeholder="${ult[k]!==undefined?'anterior: '+fmtN(ult[k]):''}"></div>`).join('')}
  </div>${rodapeModal('Salvar avaliação')}</form>`,true);
  onSubmit(m,async d=>{ const doc={alunoId:S.aluno.id,data:d.data}; CAMPOS.forEach(([k])=>{ const v=num(d[k]); if(!isNaN(v)) doc[k]=v; }); if(Object.keys(doc).length<3) throw new Error('Preencha pelo menos uma medida.'); await Store.add(P('medidas'),doc); toast('Avaliação salva!'); S.refresh(); });
}
async function excluirMedida(id){ if(!confirm('Excluir esta avaliação?')) return; await Store.del(P('medidas'),id); toast('Avaliação excluída.'); S.refresh(); }
function editarMetas(){
  const mt=S.metas||{};
  const m=abrirModal(`<h2>Metas — ${esc(S.aluno.nome)}</h2><p class="sub" style="margin-bottom:12px">Deixe em branco o que não quiser acompanhar.</p><form><div class="fg">${METAS.map(([k,t,u])=>`<div><label>${t} (${u})</label><input type="number" step="any" min="0" name="${k}" value="${mt[k]??''}"></div>`).join('')}</div>${rodapeModal('Salvar metas')}</form>`);
  onSubmit(m,async d=>{ const metas={}; METAS.forEach(([k])=>{ const v=num(d[k]); if(!isNaN(v)) metas[k]=v; }); await Store.set(P('alunos'),S.aluno.id,{metas}); toast('Metas salvas!'); S.refresh(); });
}

/* ---------- mensalidades ---------- */
function tabelaMens(l,mapa,comNome){
  if(!l.length) return '<div class="empty">Nenhuma mensalidade aqui.</div>';
  return `<table><thead><tr>${comNome?'<th>Aluno</th>':''}<th>Referência</th><th>Vencimento</th><th>Valor</th><th>Situação</th><th></th></tr></thead><tbody>${l.map(x=>{
    const a=mapa[x.alunoId]||{nome:'(aluno removido)'}, [c,t]=statusMens(x);
    return `<tr>${comNome?`<td><a style="cursor:pointer;font-weight:600" onclick="go('ficha','${x.alunoId}','mensalidades')">${esc(a.nome)}</a></td>`:''}<td>${nomeMes(x.competencia)}</td><td>${fmtD(x.vencimento)}</td><td>${R(x.valor)}</td>
    <td><span class="badge b-${c}">${t}</span>${x.pagoEm?`<div class="sub" style="font-size:11.5px">${fmtD(x.pagoEm)} · ${esc(x.forma)}</div>`:''}</td>
    <td style="text-align:right;white-space:nowrap">${x.pagoEm?`${a.telefone?`<a class="btn sm g" target="_blank" href="${linkRecibo(a,x)}">Recibo</a> `:''}<button class="btn sm ghost" onclick="estornar('${x.id}')">Desfazer</button>`:`<button class="btn sm p" onclick="pagar('${x.id}')">Receber</button> ${a.telefone?`<a class="btn sm g" target="_blank" href="${linkCobranca(a,x)}">Cobrar</a>`:''}`} <button class="btn sm ghost" title="Excluir" onclick="excluirMens('${x.id}')">🗑</button></td></tr>`;
  }).join('')}</tbody></table>`;
}

async function estornar(id){ if(!confirm('Desfazer o recebimento desta mensalidade?')) return; await Store.set(P('mensalidades'),id,{pagoEm:'',forma:''}); toast('Recebimento desfeito.'); S.refresh(); }
async function excluirMens(id){ if(!confirm('Excluir esta mensalidade?')) return; await Store.del(P('mensalidades'),id); toast('Mensalidade excluída.'); S.refresh(); }

VIEWS.mensalidades=async(el,comp=mesAtual(),filtro='todas')=>{
  S.refresh=()=>go('mensalidades',comp,filtro);
  const [alunos,mens]=await Promise.all([Store.list(P('alunos')),Store.list(P('mensalidades'))]); const mapa=idx(alunos);
  const doMes=mens.filter(x=>x.competencia===comp), vencidas=mens.filter(x=>!x.pagoEm&&x.vencimento<hoje());
  const l=(filtro==='vencidas'?vencidas:filtro==='todas'?doMes:doMes.filter(x=>statusMens(x)[0]===filtro)).sort((a,b)=>a.vencimento.localeCompare(b.vencimento)||(mapa[a.alunoId]?.nome||'').localeCompare(mapa[b.alunoId]?.nome||''));
  const cnt=k=>doMes.filter(x=>statusMens(x)[0]===k).length;
  el.innerHTML=`<div class="top"><div><h1>Mensalidades</h1><p class="sub">Recebimentos dos alunos</p></div><div class="row"><input type="month" value="${comp}" style="width:auto" onchange="this.value&&go('mensalidades',this.value,'${filtro==='vencidas'?'todas':filtro}')"><button class="btn p" onclick="gerarMes('${comp}')">⚡ Gerar mensalidades de ${nomeMes(comp)}</button></div></div>
  <div class="cards">${kpi('Previsto em '+nomeMes(comp),R(soma(doMes)),'📋')}${kpi('Recebido',R(soma(doMes.filter(x=>x.pagoEm))),'✅','var(--ok)')}${kpi('Em aberto',R(soma(doMes.filter(x=>!x.pagoEm))),'⏳','var(--warn)')}${kpi('Total vencido (todos os meses)',R(soma(vencidas)),'⚠️',vencidas.length?'var(--bad)':'')}</div>
  <div class="chips">${[['todas',`Todas (${doMes.length})`],['pago',`Pagas (${cnt('pago')})`],['pendente',`Pendentes (${cnt('pendente')})`],['atrasado',`Atrasadas (${cnt('atrasado')})`],['vencidas',`⚠️ Todas as vencidas (${vencidas.length})`]].map(([k,t])=>`<a class="chip ${k===filtro?'on':''}" onclick="go('mensalidades','${comp}','${k}')">${t}</a>`).join('')}</div>
  <div class="card tbl" style="padding:6px 10px">${tabelaMens(l,mapa,true)}</div>`;
};
async function gerarMes(comp){
  const [alunos,mens]=await Promise.all([Store.list(P('alunos')),Store.list(P('mensalidades'))]);
  const ja=new Set(mens.filter(x=>x.competencia===comp).map(x=>x.alunoId));
  const novos=alunos.filter(a=>a.ativo!==false&&!ja.has(a.id));
  if(!novos.length) return toast(`Todas as mensalidades de ${nomeMes(comp)} já foram geradas.`);
  for(const a of novos) await Store.add(P('mensalidades'),{alunoId:a.id,competencia:comp,valor:Number(a.valor)||0,vencimento:vencDe(comp,a.diaVenc),pagoEm:'',forma:''});
  toast(`${novos.length} mensalidade(s) gerada(s)!`); S.refresh();
}

/* ======================= PAINEL DO ALUNO ======================= */
async function iniciarAluno(){
  const id=S.perfil.alunoId;
  const [al,ts,md,ms,rg]=await Promise.all([Store.get(P('alunos'),id),Store.list(P('treinos'),['alunoId',id]),Store.list(P('medidas'),['alunoId',id]),Store.list(P('mensalidades'),['alunoId',id]),Store.list(P('registros'),['alunoId',id])]);
  if(!al){ toast('Cadastro de aluno não encontrado. Procure a academia.',1); await Auth.logout(); return telaLogin(); }
  S.al={aluno:al,treinos:ts.sort(porNome),medidas:md.sort(porData),mens:ms.sort((a,b)=>b.competencia.localeCompare(a.competencia)),regs:rg.sort((a,b)=>b.data.localeCompare(a.data))};
  S.feitos={};
  app().innerHTML=`${demoBar()}<div class="ap"><div class="row" style="justify-content:space-between;margin-bottom:18px;flex-wrap:nowrap"><div><p class="sub">${esc(S.acad.nome)}</p><h1>Olá, ${esc(primeiroNome(al.nome))}! 💪</h1></div><button class="btn ghost sm" onclick="sair()">Sair</button></div><div id="view"></div></div>
  <nav class="bnav"><a data-v="aTreinos" onclick="go('aTreinos')"><span>🏋️</span>Treinos</a><a data-v="aEvolucao" onclick="go('aEvolucao')"><span>📈</span>Evolução</a><a data-v="aPagamentos" onclick="go('aPagamentos')"><span>💳</span>Pagamentos</a></nav>`;
  go('aTreinos');
}
const rotuloCurto=(n,k)=>{ const m=String(n).match(/treino\s+([A-Z0-9]+)/i); return m?'Treino '+m[1].toUpperCase():(String(n).length>18?String(n).slice(0,16)+'…':n||'Treino '+(k+1)); };
VIEWS.aTreinos=async(el,i)=>{
  const {treinos,regs}=S.al;
  const sem=regs.filter(r=>diasEntre(r.data,hoje())<7).length;
  const kpis=`<div class="cards" style="grid-template-columns:1fr 1fr;margin-bottom:16px">${kpi('Últimos 7 dias',sem+' treino'+(sem===1?'':'s'),'🔥')}${kpi('Total concluído',regs.length,'🏆')}</div>`;
  if(!treinos.length){ el.innerHTML=kpis+'<div class="card empty">Seu instrutor ainda não cadastrou seus treinos.</div>'; return; }
  if(i==null){ const u=regs[0]; const k=u?treinos.findIndex(t=>t.id===u.treinoId):-1; i=k<0?0:(k+1)%treinos.length; }
  const t=treinos[i], f=S.feitos[t.id]||(S.feitos[t.id]=[]), n=(t.exercicios||[]).length;
  el.innerHTML=kpis+`<div class="chips">${treinos.map((x,k)=>`<a class="chip ${k===i?'on':''}" onclick="go('aTreinos',${k})">${esc(rotuloCurto(x.nome,k))}</a>`).join('')}</div>
  <div class="card" style="margin-bottom:12px"><h2 style="margin:0">${esc(t.nome)}</h2><p class="sub">${esc(t.dias||'')}${t.dias?' · ':''}${n} exercícios${regs[0]&&regs[0].treinoId!==t.id&&i===((treinos.findIndex(x=>x.id===regs[0].treinoId)+1)%treinos.length)?' · <b style="color:var(--acc)">próximo da sequência</b>':''}</p>${t.obs?`<p class="sub" style="margin-top:6px">📝 ${esc(t.obs)}</p>`:''}<div class="prog" style="margin-top:12px"><i id="pg" style="width:${n?f.length/n*100:0}%"></i></div><p class="sub" id="pgt" style="margin-top:4px;font-size:12px">${f.length} de ${n} feitos</p></div>
  ${(t.exercicios||[]).map((x,k)=>`<div class="exc ${f.includes(k)?'ok':''}" onclick="marcarEx('${t.id}',${k},this,${n})"><div class="ck">${f.includes(k)?'✓':k+1}</div><div><div class="nm" style="font-weight:600">${esc(x.nome)}</div><div class="sub">${esc(descEx(x))}</div></div></div>`).join('')}
  <button class="btn p" style="width:100%;justify-content:center;padding:14px;margin-top:8px" onclick="concluirTreino('${t.id}',${i})">✅ Concluir treino</button>`;
};
function marcarEx(tid,k,el,n){
  const f=S.feitos[tid], p=f.indexOf(k); if(p<0) f.push(k); else f.splice(p,1);
  el.classList.toggle('ok',p<0); el.querySelector('.ck').textContent=p<0?'✓':k+1;
  $('#pg').style.width=(f.length/n*100)+'%'; $('#pgt').textContent=`${f.length} de ${n} feitos`;
}
async function concluirTreino(tid,i){
  const t=S.al.treinos.find(x=>x.id===tid), f=S.feitos[tid]||[];
  if(!f.length&&!confirm('Nenhum exercício marcado. Concluir mesmo assim?')) return;
  const reg={alunoId:S.al.aluno.id,treinoId:tid,nome:t.nome,data:hoje(),feitos:f.length,total:(t.exercicios||[]).length};
  try{ const id=await Store.add(P('registros'),reg); S.al.regs.unshift({id,...reg}); S.feitos[tid]=[]; toast('Treino concluído! Mandou bem 🔥'); go('aTreinos',(i+1)%S.al.treinos.length); }
  catch(e){ toast(erroAuth(e),1); }
}
VIEWS.aEvolucao=async el=>{
  const {aluno,medidas}=S.al, u=medidas[medidas.length-1];
  S.medidas=medidas; S.metas=aluno.metas||{};
  el.innerHTML=`${u?`<p class="sub" style="margin-bottom:8px">Última avaliação: ${fmtD(u.data)}</p><div class="cards" style="grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px">${kpi('Peso',u.peso?fmtN(u.peso)+'kg':'—')}${kpi('IMC',imc(u)||'—')}${kpi('Gordura',u.gordura?fmtN(u.gordura)+'%':'—')}</div>`:''}
  <div class="card" style="margin-bottom:12px"><h2>🎯 Minhas metas</h2>${blocoMetas(medidas,S.metas)}</div>
  ${medidas.length?`<div class="card" style="margin-bottom:12px"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">📈 Evolução</h2>${selCampo()}</div><div class="chartbox"><canvas id="cEvol"></canvas></div></div>
  <div class="card tbl" style="padding:6px 10px">${tabelaMedidas(medidas,false)}</div>`:'<div class="card empty">Nenhuma avaliação física registrada ainda. Peça ao seu instrutor!</div>'}`;
  if(medidas.length) desenharEvol();
};
VIEWS.aPagamentos=async el=>{
  const {mens,aluno}=S.al, ab=mens.filter(x=>!x.pagoEm).sort((a,b)=>a.vencimento.localeCompare(b.vencimento)), p=ab[0];
  el.innerHTML=`${p?`<div class="card" style="margin-bottom:12px;${p.vencimento<hoje()?'border-color:var(--bad)':''}"><p class="sub">Próxima mensalidade ${(()=>{const [c,t]=statusMens(p);return `<span class="badge b-${c}">${t}</span>`})()}</p><p style="font-size:30px;font-weight:800">${R(p.valor)}</p><p class="sub" style="margin-bottom:12px">${nomeMes(p.competencia)} · vence em ${fmtD(p.vencimento)}${ab.length>1?` · ${ab.length} em aberto (${R(soma(ab))})`:''}</p>
  ${S.acad.pix?`<label>Chave Pix da academia</label><div class="pix" style="margin-bottom:10px">${esc(S.acad.pix)}</div><div class="row"><button class="btn p" data-v="${esc(S.acad.pix)}" onclick="copiar(this.dataset.v)">Copiar chave Pix</button>${S.acad.whatsapp?`<a class="btn g" target="_blank" href="${wa(S.acad.whatsapp,`Olá! Sou ${aluno.nome}, segue o comprovante da mensalidade de ${nomeMes(p.competencia)}.`)}">Enviar comprovante</a>`:''}</div>`:'<p class="sub">Pague na recepção da academia.</p>'}</div>`
  :`<div class="card" style="margin-bottom:12px;text-align:center"><div style="font-size:36px">✅</div><b>Tudo em dia!</b><p class="sub">Você não tem mensalidades em aberto.</p></div>`}
  <div class="card"><h2>Histórico</h2>${mens.length?mens.map(x=>{const [c,t]=statusMens(x);return `<div class="li"><div style="flex:1"><b>${nomeMes(x.competencia)}</b><div class="sub">${x.pagoEm?'Pago em '+fmtD(x.pagoEm):'Vence em '+fmtD(x.vencimento)}</div></div><div style="text-align:right"><b>${R(x.valor)}</b><div><span class="badge b-${c}">${t}</span></div></div></div>`}).join(''):'<p class="sub">Nenhuma mensalidade ainda.</p>'}</div>`;
};

init();
</script>
</body>
</html>
